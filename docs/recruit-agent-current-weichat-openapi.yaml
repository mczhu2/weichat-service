      summary: 获取标签列表
      x-called-by:
        - recruit-agent/wecom-bridge.js#getLabelList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseRequest'
      responses:
        '200':
          description: 标签列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelListApiResult'

  /api/v1/tag/labelAddUser:
    post:
      tags: [Tag]
      summary: 标签添加用户
      x-called-by:
        - recruit-agent/wecom-bridge.js#labelAddUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelAddUserRequest'
      responses:
        '200':
          description: 添加结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVoidResult'

  /api/v1/wx/message:
    post:
      tags: [LocalData]
      summary: 新增微信消息信息
      description: legacy wecom-bridge 当前调用 addWxMessage，用于写入 WxMessageInfo。该接口返回 text/plain 字符串，不是 ApiResult。
      x-called-by:
        - recruit-agent/wecom-bridge.js#addWxMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 写入成功
          content:
            text/plain:
              schema:
                type: string
                example: 微信消息信息新增成功
        '400':
          description: 写入失败
          content:
            text/plain:
              schema:
                type: string

components:
  schemas:
    ApiResult:
      type: object
      description: weichat-service 统一响应包装。code=0 表示成功，非 0 表示失败；业务数据放在 data。
      properties:
        code:
          type: integer
          description: 响应码；0 表示成功，非 0 表示失败。
          example: 0
        msg:
          type: string
          description: 响应消息；成功通常为 ok，失败返回错误说明。
          example: ok
        data:
          description: 业务响应数据；不同接口结构不同，空结果可为 null。
          nullable: true
        total:
          type: integer
          nullable: true
          description: 列表类接口的总条数；非分页接口通常不返回。
          example: 100

    ApiVoidResult:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              nullable: true

    BaseRequest:
      type: object
      required: [uuid]
      description: 需要绑定到某个企微运行客户端的通用请求体；uuid 始终放在 JSON body 中传递。
      properties:
        uuid:
          type: string
          description: /api/v1/init/init 返回的客户端实例 ID。后续二维码、状态查询、联系人、群、消息发送、退出登录接口必须复用同一个 uuid；不要放 query/header。
          example: 0190-example-uuid

    InitRequest:
      type: object
      description: 初始化企微客户端。最小请求体可以为空；如需复用指定企微用户，可传 vid。
      properties:
        vid:
          type: integer
          format: int64
          nullable: true
          description: 可选的企微用户 vid；为空时由服务侧创建/分配客户端。
          example: 7881301772935700
      example: {}
    InitResponse:
      type: object
      description: 初始化结果。uuid 是后续登录绑定、联系人、群列表、消息发送接口的核心入参；vid 是可选复用凭据。
      properties:
        uuid:
          type: string
          description: 客户端实例 ID；初始化成功后保存，后续接口在 body 中复用。
          example: 0190-example-uuid
        vid:
          type: integer
          format: int64
          nullable: true
          description: 企微账号 ID；首次登录成功后可从初始化/状态数据中取得并按业务需要持久化，用于后续复用账号。
          example: 7881301772935700
        loginState:
          type: integer
          nullable: true
          description: 初始化阶段/旧协议兼容登录状态字段；不要单独用它判断可发消息。最终以 getRunClientByUuid 的 loginType=2 且 longLinkState=CONNECTED 为准。
          example: 0
        qrCode:
          type: string
          nullable: true
          description: 初始化阶段如直接返回二维码，则为二维码 URL、data URI 或 base64 字符串；常规流程仍建议调用 getQrCode。
          example: data:image/png;base64,iVBORw0KGgo...

    InitApiResult:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/InitResponse'

    CheckCodeRequest:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          required: [qrcodeKey, code]
          description: 录入登录授权码。先 getQrCode 并扫码，再把授权码提交到该接口。
          properties:
            qrcodeKey:
              type: string
              description: getQrCode 返回的二维码 key；api-call-service.html 从二维码响应自动填充。
              example: 114A2A26E50DE4BC
            code:
              type: string
              description: 用户扫码后页面/设备上展示的登录授权码。
              example: '123456'
      example:
        uuid: 0190-example-uuid
        qrcodeKey: 114A2A26E50DE4BC
        code: '123456'


    QrCodeResponse:
      type: object
      description: 登录二维码响应。调用方展示二维码后，用户扫码并在页面/设备获得授权码，再把 qrcodeKey 和授权码提交到 checkCode。
      properties:
        qrCode:
          type: string
          description: 二维码图片内容。可能是 URL、完整 data URI，或不带 data:image 前缀的 base64 字符串；裸 base64 需补前缀后再用于 img src。
          example: data:image/png;base64,iVBORw0KGgo...
        Key:
          type: string
          description: 二维码 key；checkCode 请求中的 qrcodeKey 应使用该值。部分下游也可能返回 key/qrcodeKey 兼容字段。
          example: 114A2A26E50DE4BC
        status:
          type: integer
          description: 二维码状态码；以协议服务返回为准，调用方不要用该字段替代 checkCode/getRunClientByUuid 流程判断。
          example: 0
        expireTime:
          type: integer
          description: 二维码过期时间或剩余秒数；该字段不稳定时，过期/扫码失败后重新 getQrCode。
          example: 300

    QrCodeApiResult:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/QrCodeResponse'

    RunClientResponse:
      type: object
      additionalProperties: false
      description: 当前 uuid 对应企微客户端运行状态。api-call-service.html 以 loginType=2 且 longLinkState=CONNECTED 判断登录和长连接正常。
      properties:
        uuid:
          type: string
          description: 客户端唯一标识。
          example: 0190-example-uuid
        vid:
          type: integer
          format: int64
          description: 登录账号 vid。
          example: 7881301772935700
        nickname:
          type: string
          description: 登录账号昵称。
          example: 张三
        headImg:
          type: string
          description: 头像 URL。
          example: https://example.com/avatar.jpg
        corpId:
          type: string
          description: 企业 ID。
          example: '1970324998039140'
        corpName:
          type: string
          description: 企业名称。
          example: 测试企业
        loginState:
          type: integer
          description: 旧协议兼容登录状态字段；不要单独作为可发消息判断。
          example: 1
        onlineState:
          type: integer
          description: 旧协议兼容在线状态字段；最终以 longLinkState 为准。
          example: 1
        loginType:
          type: integer
          description: 登录阶段字段；0/空表示未初始化或未知，1 表示已初始化未完成登录，2 表示已登录。可发消息还必须同时满足 longLinkState=CONNECTED。
          example: 2
        longLinkState:
          type: string
          description: 长连接状态；CONNECTED 表示连接正常。调用方应使用 loginType=2 AND longLinkState=CONNECTED 判断登录链路可用。
          example: CONNECTED
        isLogin:
          type: boolean
          description: 是否已登录；部分响应可能返回该兼容字段。
          example: true
      example:
        uuid: 0190-example-uuid
        vid: 7881301772935700
        nickname: 张三
        corpName: 测试企业
        loginType: 2
        longLinkState: CONNECTED
        isLogin: true

    RunClientApiResult:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RunClientResponse'

    SendTextRequest:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          required: [send_userid, isRoom, content]
          description: 发送纯文本消息。单好友和外部群共用该接口，通过 isRoom 区分目标类型；不支持 @ 人或混合表情扩展。
          properties:
            send_userid:
              oneOf:
                - type: string
                - type: integer
                  format: int64
              description: 接收目标 ID。isRoom=false 时填外部联系人的 userId/vid；isRoom=true 时填外部群的 room_id。后端字段类型是 Java Long；浏览器/JS 客户端建议按十进制字符串传递，避免超过 Number.MAX_SAFE_INTEGER 后发生精度丢失。
              example: '7881301772935700'
            isRoom:
              type: boolean
              description: 目标是否为群。false=单好友文本；true=外部群文本。
              example: false
            content:
              type: string
              description: 要发送的纯文本内容；H5 demo 按最小参数只传文本，不传 JSON 数组。
              example: 你好
      example:
        uuid: 0190-example-uuid
        send_userid: '7881301772935700'
        isRoom: false
        content: 你好，这是一条测试消息

    SendLinkRequest:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          required: [send_userid, isRoom, title, content, url]
          description: 发送链接卡片消息；OpenAPI 仅展示必填字段，封面图等非必填扩展参数隐藏。
          properties:
            send_userid:
              oneOf:
                - type: string
                - type: integer
                  format: int64
              description: 接收人 ID；单聊填好友 userId/vid，群聊填群 ID。
              example: '7881301772935700'
            isRoom:
              type: boolean
              description: 是否群消息。
              example: false
            title:
              type: string
              description: 链接卡片标题。
              example: 面试安排确认
            content:
              type: string
              description: 链接卡片摘要。
              example: 请点击查看本次面试安排
            url:
              type: string
              format: uri
              description: 点击卡片打开的链接。
              example: https://agent.example.com/interview/123
      example:
        uuid: 0190-example-uuid
        send_userid: '7881301772935700'
        isRoom: false
        title: 面试安排确认
        content: 请点击查看本次面试安排
        url: https://agent.example.com/interview/123

    SendAppMessageRequest:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          required: [send_userid, title, appName, appid, username, pagepath]
          description: 发送企业微信小程序卡片消息；OpenAPI 仅展示服务端标注的必填字段，isRoom、desc、图标、封面等非必填扩展参数隐藏。
          properties:
            send_userid:
              oneOf:
                - type: string
                - type: integer
                  format: int64
              description: 接收人 ID；单聊填好友 userId/vid，群聊填群 ID。
              example: '7881301772935700'
            title:
              type: string
              description: 小程序卡片标题。
              example: 候选人详情
            appName:
              type: string
              description: 小程序展示名称。
              example: 招聘助手
            appid:
              type: string
              description: 小程序 appid。
              example: wx1234567890abcdef
            username:
              type: string
              description: 小程序原始 ID 或 username。
              example: gh_abcdef123456
            pagepath:
              type: string
              description: 小程序页面路径。
              example: pages/candidate/detail?id=123
      example:
        uuid: 0190-example-uuid
        send_userid: '7881301772935700'
        title: 候选人详情
        appName: 招聘助手
        appid: wx1234567890abcdef
        username: gh_abcdef123456
        pagepath: pages/candidate/detail?id=123

    SendMsgResponse:
      type: object
      description: 消息发送结果。
      properties:
        msgId:
          type: integer
          format: int64
          description: 本地或协议侧消息 ID。
          example: 189000000001
        serverMsgId:
          type: string
          description: 服务端消息 ID；用于后续追踪消息状态。
          example: msg-server-123
        createTime:
          type: integer
          format: int64
          description: 消息创建时间，通常为 Unix 时间戳。
          example: 1768975066
        status:
          type: integer
          description: 发送状态码；0/成功或具体含义以协议服务返回为准。
          example: 0

    SendMsgApiResult:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SendMsgResponse'

    SpeechToTextRequest:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          required: [msgId]
          description: 将语音消息转换为文本。recruit-agent 在处理语音回调时使用；OpenAPI 仅展示必填 msgId，语音路径/URL 等非必填扩展参数隐藏。
          properties:
            msgId:
              type: string
              description: 语音消息 ID。
              example: '189000000001'
      example:
        uuid: 0190-example-uuid
        msgId: '189000000001'

    SpeechToTextApiResult:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              properties:
                text:
                  type: string
                  description: 语音识别后的文本内容。
                  example: 你好，请问还在吗
              example:
                text: 你好，请问还在吗
    GetExternalContactsRequest:
      type: object
      required: [uuid, limit, seq]
      description: 获取外部联系人列表。该接口使用游标分页：首次 seq=0；响应 data.seq 是下一页游标，前端应放入下拉框供用户继续加载。
      properties:
        uuid:
          type: string
          description: 账号初始化得到并保存的全局 UUID。
          example: 0190-example-uuid
        limit:
          type: integer
          description: 每页数量；api-call-service.html 默认 100，旧 recruit-agent 默认可能为 200。
          default: 100
          example: 100
        seq:
          type: integer
          format: int64
          description: 分页游标。首次传 0；后续传上一次响应 data.seq。
          default: 0
          example: 0
      example:
        uuid: 0190-example-uuid
        limit: 100
        seq: 0

    GetInnerContactsRequest:
      type: object
      required: [uuid, limit, strSeq]
      description: 获取内部联系人列表。内部通讯录使用字符串游标 strSeq。
      properties:
        uuid:
          type: string
          description: 账号初始化得到并保存的全局 UUID。
          example: 0190-example-uuid
        limit:
          type: integer
          description: 每页数量。
          example: 200
        strSeq:
          type: string
          description: 字符串分页游标；首次传空字符串，后续传响应中的下一页游标。
          example: ''
      example:
        uuid: 0190-example-uuid
        limit: 200
        strSeq: ''

    VidsRequest:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          required: [vids]
          description: 根据一组 vid/userId 批量查询联系人详情。
          properties:
            vids:
              type: array
              description: 需要查询的联系人 ID 列表。
              items:
                type: integer
                format: int64
              example: [7881301772935700]
      example:
        uuid: 0190-example-uuid
        vids: [7881301772935700]

    SearchContactRequest:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          required: [keyword]
          description: 按关键字搜索联系人。
          properties:
            keyword:
              type: string
              description: 搜索关键字，可为昵称、备注、手机号等下游支持字段。
              example: 张三
      example:
        uuid: 0190-example-uuid
        keyword: 张三

    ContactInfo:
      type: object
      additionalProperties: false
      description: 联系人信息。外部联系人列表中用于发送单好友文本消息的关键字段是 userId/vid。
      properties:
        userId:
          type: integer
          format: int64
          description: 用户 ID；发送单好友消息时可填入 SendTextRequest.send_userid。
          example: 7881301772935700
        vid:
          type: integer
          format: int64
          description: recruit-agent 兼容字段；weichat-service ContactInfo 主要返回 userId，部分下游数据可能返回 vid。
          example: 7881301772935700
        acctId:
          type: string
          description: 账号 ID；下游字段 acctid。
          example: wxid_xxx
        unionId:
          type: string
          description: 微信开放平台 unionId。
          example: ozynqsqC7yU4vcGRIYbl8cryOypE
        nickname:
          type: string
          description: 昵称；下游字段 nickname/name。
          example: 张三
        realName:
          type: string
          description: 真实姓名；下游字段 realname。
          example: 张三
        avatar:
          type: string
          format: uri
          description: 头像 URL。
          example: https://example.com/avatar.jpg
        mobile:
          type: string
          description: 手机号。
          example: '13800138000'
        email:
          type: string
          description: 邮箱。
          example: test@example.com
        sex:
          type: integer
          description: 性别；0 未知，1 男，2 女。
          example: 1
        position:
          type: string
          description: 职位。
          example: 工程师
        corpName:
          type: string
          description: 企业名称；下游字段 corp_name/corpName。
          example: 测试企业
        corpId:
          type: integer
          format: int64
          description: 企业 ID；下游字段 corpid/corp_id/corpId。
          example: 1970324998039140
        remarks:
          type: string
          description: 备注名；下游字段 remarks/remark。
          example: 张三-客户
        realRemarks:
          type: string
          description: 真实备注；下游字段 real_remarks/realRemarks。
          example: 重要客户
        status:
          type: integer
          description: 联系人状态码；以协议服务返回为准。
          example: 9
        source:
          type: integer
          description: 客户来源类型；以企微协议返回为准。
          example: 51
        createTime:
          type: integer
          format: int64
          description: 创建时间 Unix 时间戳。
          example: 1768975066
        addCustomerTime:
          type: integer
          format: int64
          description: 添加客户时间 Unix 时间戳。
          example: 1768975066
        seq:
          type: integer
          format: int64
          description: 条目级分页游标；列表响应 data.seq 才是下一页游标。
          example: 8596253

    ContactListResponse:
      type: object
      description: 外部联系人列表响应。分页方式为游标下拉分页：把 seq 加入下拉框，下一次请求传该 seq。
      properties:
        total:
          type: integer
          description: 联系人总数。
          example: 100
        seq:
          type: integer
          format: int64
          description: 下一次查询游标；首次请求传 0，后续请求传上次响应的该值。
          example: 8052931
        list:
          type: array
          description: 当前页联系人列表。
          items:
            $ref: '#/components/schemas/ContactInfo'
      example:
        total: 100
        seq: 8052931
        list:
          - userId: 7881301772935700
            nickname: 张三
            remarks: 张三-客户
            corpName: 测试企业
            mobile: '13800138000'

    InnerContactListResponse:
      type: object
      description: 内部联系人列表响应。
      properties:
        total:
          type: integer
          description: 联系人总数。
          example: 80
        seq:
          type: string
          description: 下一次查询字符串游标。
          example: next-page-token
        list:
          type: array
          description: 当前页内部联系人列表。
          items:
            $ref: '#/components/schemas/ContactInfo'
      example:
        total: 80
        seq: next-page-token
        list:
          - userId: 7881301772935700
            nickname: 张三
            corpName: 测试企业
            mobile: '13800138000'

    ContactListApiResult:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ContactListResponse'

    InnerContactListApiResult:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/InnerContactListResponse'

    ContactArrayApiResult:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ContactInfo'

    SessionInfo:
      type: object
      description: 会话信息。
      properties:
        vid:
          type: integer
          format: int64
          description: 会话目标 ID；单聊为联系人 vid，群聊为群 ID。
          example: 7881301772935700
        name:
          type: string
          description: 会话名称。
          example: 张三
        headImg:
          type: string
          format: uri
          description: 会话头像 URL。
          example: https://example.com/avatar.jpg
        isRoom:
          type: boolean
          description: 是否群会话。
          example: false
        lastMsg:
          type: string
          description: 最近一条消息摘要。
          example: 你好
        lastMsgTime:
          type: integer
          format: int64
          description: 最近消息时间 Unix 时间戳。
          example: 1768975066
        unreadCount:
          type: integer
          description: 未读数。
          example: 0
        isTop:
          type: boolean
          description: 是否置顶。
          example: false
        isShield:
          type: boolean
          description: 是否免打扰。
          example: false
        isFold:
          type: boolean
          description: 是否折叠。
          example: false

    SessionListApiResult:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/SessionInfo'

    GetChatroomMembersRequest:
      type: object
      required: [uuid, limit, star_index]
      description: 获取外部客户群列表。api-call-service.html 首次传 star_index=0；响应 data.next_start 大于等于 0 时放入下拉框用于下一页。
      properties:
        uuid:
          type: string
          description: 账号初始化得到并保存的全局 UUID。
          example: 0190-example-uuid
        limit:
          type: integer
          description: 每页数量；api-call-service.html 默认 5。
          default: 5
          example: 5
        star_index:
          type: integer
          description: 分页起始下标。首次传 0；后续传上一次响应 data.next_start。字段名来自服务端 VO，使用 star_index，不是 start_index。
          default: 0
          example: 0
      example:
        uuid: 0190-example-uuid
        limit: 5
        star_index: 0

    ChatroomInfo:
      type: object
      additionalProperties: false
      description: 外部客户群信息。api-call-service.html 用 room_id 作为 sendText 的 send_userid，nickname/total/create_time/update_time 只用于列表展示。
      properties:
        room_id:
          oneOf:
            - type: string
            - type: integer
              format: int64
          description: 外部群 ID；服务端 VO 为 Java Long。浏览器/JS 客户端应按字符串处理该字段，再填入 SendTextRequest.send_userid，避免 room_id 超过 Number.MAX_SAFE_INTEGER 后渲染/选择时丢失精度。
          example: '189000000001'
        create_user_id:
          type: integer
          format: int64
          description: 创建人 ID；按协议服务返回展示。
          example: 0
        infoticket:
          type: string
          description: 群信息票据；H5 demo 不参与后续最小发送请求。
          example: 9FE241BC08F50F9A2FCBA692759B6FD8A5EA88B107787838
        update_time:
          type: integer
          format: int64
          description: 更新时间，通常为 Unix 时间戳。
          example: 1650135314
        total:
          type: integer
          description: 群成员数量。
          example: 4
        create_time:
          type: integer
          format: int64
          description: 创建时间，通常为 Unix 时间戳。
          example: 1648889598
        nickname:
          type: string
          description: 群名称；H5 demo 列表展示字段。
          example: 客户沟通群
        roomurl:
          type: string
          format: uri
          description: 群头像 URL；H5 demo 当前不展示。
          example: https://wework.qpic.cn/wwpic/699045_06DbkaBSSVeLfTg_1652088785/0

    ChatroomMembersResponse:
      type: object
      description: 外部客户群列表响应。分页方式为 star_index/next_start：下一页请求传上一次响应的 next_start。
      properties:
        total:
          type: integer
          description: 外部群总数。
          example: 7
        next_start:
          type: integer
          description: 下一次查询起始下标；大于等于 0 时可继续分页。
          example: 5
        roomList:
          type: array
          description: 当前页外部群列表。
          items:
            $ref: '#/components/schemas/ChatroomInfo'
      example:
        total: 7
        next_start: 5
        roomList:
          - room_id: '189000000001'
            nickname: 客户沟通群
            total: 4
            create_time: 1648889598
            update_time: 1650135314

    ChatroomMembersApiResult:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ChatroomMembersResponse'

    RoomIdRequest:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          required: [roomid]
          description: 查询群成员列表的请求。
          properties:
            roomid:
              type: integer
              format: int64
              description: weichat-service VO 字段名为 roomid；查询群成员时必须使用该字段。
              example: 189000000001
      example:
        uuid: 0190-example-uuid
        roomid: 189000000001

    RoomInfo:
      type: object
      description: 群会话信息。
      properties:
        roomId:
          type: integer
          format: int64
          description: 群 ID。
          example: 189000000001
        name:
          type: string
          description: 群名称。
          example: 招聘沟通群
        headImg:
          type: string
          format: uri
          description: 群头像 URL。
          example: https://example.com/room.png
        notice:
          type: string
          description: 群公告。
          example: 请及时同步面试进展
        ownerVid:
          type: integer
          format: int64
          description: 群主 vid。
          example: 7881301772935700
        ownerNickname:
          type: string
          description: 群主昵称。
          example: 张三
        memberCount:
          type: integer
          description: 群成员数量。
          example: 12
        adminVids:
          type: array
          description: 管理员 vid 列表。
          items:
            type: integer
            format: int64
          example: [7881301772935700]
        createTime:
          type: integer
          format: int64
          description: 建群时间 Unix 时间戳。
          example: 1768975066
        isMute:
          type: boolean
          description: 是否全员禁言。
          example: false
        disableRename:
          type: boolean
          description: 是否禁止改群名。
          example: false
        inviteConfirm:
          type: boolean
          description: 邀请入群是否需要确认。
          example: false

    RoomMemberInfo:
      type: object
      description: 群成员信息。
      properties:
        vid:
          type: integer
          format: int64
          description: 成员 vid。
          example: 7881301772935700
        nickname:
          type: string
          description: 成员昵称。
          example: 张三
        roomNickname:
          type: string
          description: 群内昵称。
          example: 张三-招聘
        headImg:
          type: string
          format: uri
          description: 头像 URL。
          example: https://example.com/avatar.jpg
        role:
          type: integer
          description: 群角色；具体枚举以协议服务返回为准。
          example: 1
        joinTime:
          type: integer
          format: int64
          description: 入群时间 Unix 时间戳。
          example: 1768975066
        inviterVid:
          type: integer
          format: int64
          description: 邀请人 vid。
          example: 7881301772935701

    RoomListApiResult:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/RoomInfo'

    RoomMemberArrayApiResult:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/RoomMemberInfo'

    AddLabelRequest:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          required: [labelName]
          description: 新增联系人标签。
          properties:
            labelName:
              type: string
              description: 标签名称。
              example: 高意向候选人
      example:
        uuid: 0190-example-uuid
        labelName: 高意向候选人

    LabelAddUserRequest:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          required: [labelId, vids]
          description: 给联系人批量添加标签。
          properties:
            labelId:
              type: string
              description: 标签 ID。
              example: label-123
            vids:
              type: array
              description: 需要打标签的联系人 vid/userId 列表。
              items:
                oneOf:
                  - type: string
                  - type: integer
                    format: int64
              example: ['7881301772935700']
      example:
        uuid: 0190-example-uuid
        labelId: label-123
        vids: ['7881301772935700']

    LabelInfo:
      type: object
      description: 标签信息。
      properties:
        labelId:
          type: string
          description: 标签 ID。
          example: label-123
        labelName:
          type: string
          description: 标签名称。
          example: 高意向候选人
        color:
          type: string
          description: 标签颜色。
          example: '#2f80ed'
        userCount:
          type: integer
          description: 标签下用户数量。
          example: 10
        createTime:
          type: integer
          format: int64
          description: 标签创建时间 Unix 时间戳。
          example: 1768975066

    LabelListResponse:
      type: object
      description: 标签列表响应。
      properties:
        total:
          type: integer
          description: 标签总数。
          example: 3
        list:
          type: array
          description: 标签列表。
          items:
            $ref: '#/components/schemas/LabelInfo'
      example:
        total: 1
        list:
          - labelId: label-123
            labelName: 高意向候选人
            color: '#2f80ed'
            userCount: 10
            createTime: 1768975066

    LabelListApiResult:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LabelListResponse'

