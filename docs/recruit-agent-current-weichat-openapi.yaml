openapi: 3.0.3
info:
  title: weichat-service APIs currently used by recruit-agent
  version: 1.0.0
  description: |
    仅包含 /Users/mczhu/Documents/trae_projects/recruit-agent 当前代码中调用到的 weichat-service 接口。
    调用来源：
    - src/packages/channel-core/src/wecom-client.ts
    - wecom-bridge.js
    - server.js 回调/发送链路

    未纳入 47.94.7.218:9952 控制面 /wxwork/* 直连接口；这里只描述 weichat-service 的 8066 数据面与回调入口。
servers:
  - url: http://localhost:8066
    description: local weichat-api
  - url: http://ai-agent.okgcc.cn/wx
    description: service demo page base path; nginx strips /wx before forwarding to weichat-api
  - url: http://47.115.229.106:8066
    description: recruit-agent legacy configured data plane

tags:
  - name: LoginAttach
    description: 登录挂靠与客户端状态
  - name: Contact
    description: 联系人/会话/群查询
  - name: Message
    description: agent 当前发送/语音转文字相关接口
  - name: Tag
    description: 标签接口，legacy wecom-bridge 当前调用
  - name: CallbackIngress
    description: 企微回调接收入口
  - name: LocalData
    description: legacy wecom-bridge 当前写入本地消息数据接口

paths:
  /api/v1/init/init:
    post:
      tags: [LoginAttach]
      summary: 初始化企微客户端
      x-called-by:
        - recruit-agent/src/packages/channel-core/src/wecom-client.ts#init
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitRequest'
            examples:
              ipadDefault:
                value:
                  proxySituation: 0
                  deverType: ipad
      responses:
        '200':
          description: 初始化结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitApiResult'

  /api/v1/init/setCallbackUrl:
    post:
      tags: [LoginAttach]
      summary: 设置企微消息回调 URL
      x-called-by:
        - recruit-agent/src/packages/channel-core/src/wecom-client.ts#setCallbackUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCallbackUrlRequest'
            examples:
              basic:
                value:
                  uuid: 0190-example-uuid
                  url: https://agent.example.com/api/wecom/callback
      responses:
        '200':
          description: 设置结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVoidResult'

  /api/v1/init/getRunClientByUuid:
    post:
      tags: [LoginAttach]
      summary: 根据 uuid 查询客户端状态
      x-called-by:
        - recruit-agent/src/packages/channel-core/src/wecom-client.ts#getRunClientByUuid
        - recruit-agent/wecom-bridge.js#getRunClientByUuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseRequest'
            examples:
              byUuid:
                value:
                  uuid: 0190-example-uuid
      responses:
        '200':
          description: 客户端状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunClientApiResult'

  /api/v1/init/getRunClient:
    post:
      tags: [LoginAttach]
      summary: 查询运行客户端
      x-called-by:
        - recruit-agent/src/packages/channel-core/src/wecom-client.ts#getRunClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseRequest'
            examples:
              optionalUuidFilter:
                value:
                  uuid: 0190-example-uuid
      responses:
        '200':
          description: 客户端状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunClientApiResult'

  /api/v1/init/getQrCode:
    post:
      tags: [LoginAttach]
      summary: 获取登录二维码
      x-called-by:
        - recruit-agent/src/packages/channel-core/src/wecom-client.ts#getQrCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseRequest'
            examples:
              byUuid:
                value:
                  uuid: 0190-example-uuid
      responses:
        '200':
          description: 二维码
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrCodeApiResult'

  /api/v1/init/checkCode:
    post:
      tags: [LoginAttach]
      summary: 校验二维码/设备验证码
      x-called-by:
        - recruit-agent/src/packages/channel-core/src/wecom-client.ts#checkCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckCodeRequest'
            examples:
              loginAuthCode:
                value:
                  uuid: 0190-example-uuid
                  qrcodeKey: 114A2A26E50DE4BC
                  code: '123456'
      responses:
        '200':
          description: 校验结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVoidResult'

  /api/v1/init/secondaryValidation:
    post:
      tags: [LoginAttach]
      summary: 二次验证
      x-called-by:
        - recruit-agent/src/packages/channel-core/src/wecom-client.ts#secondaryValidation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecondaryValidationRequest'
            examples:
              whenRequired:
                value:
                  uuid: 0190-example-uuid
                  qrcodeKey: 114A2A26E50DE4BC
      responses:
        '200':
          description: 验证结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVoidResult'

  /api/v1/init/loginOut:
    post:
      tags: [LoginAttach]
      summary: 登出企微客户端
      x-called-by:
        - recruit-agent/src/packages/channel-core/src/wecom-client.ts#loginOut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseRequest'
            examples:
              byUuid:
                value:
                  uuid: 0190-example-uuid
      responses:
        '200':
          description: 登出结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVoidResult'

  /api/v1/init/closeConnect:
    post:
      tags: [LoginAttach]
      summary: 关闭连接
      x-called-by:
        - recruit-agent/src/packages/channel-core/src/wecom-client.ts#closeConnect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseRequest'
            examples:
              byUuid:
                value:
                  uuid: 0190-example-uuid
      responses:
        '200':
          description: 关闭结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVoidResult'

  /api/v1/message/sendText:
    post:
      tags: [Message]
      summary: 发送文本消息
      x-called-by:
        - recruit-agent/src/packages/channel-core/src/wecom-client.ts#sendText
        - recruit-agent/wecom-bridge.js#sendText
        - recruit-agent/server.js#processWecomAgentTurn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTextRequest'
            examples:
              singleFriendText:
                summary: api-call-service.html 单好友文本发送
                value:
                  uuid: 0190-example-uuid
                  send_userid: '7881301772935700'
                  isRoom: false
                  content: 你好，这是一条测试消息
              groupText:
                summary: 群文本发送；当前 H5 demo 不开放该入口
                value:
                  uuid: 0190-example-uuid
                  send_userid: '189000000001'
                  isRoom: true
                  content: 群消息测试
      responses:
        '200':
          description: 发送结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMsgApiResult'

  /api/v1/message/sendLink:
    post:
      tags: [Message]
      summary: 发送链接消息
      x-called-by:
        - recruit-agent/src/packages/channel-core/src/wecom-client.ts#sendLink
        - recruit-agent/wecom-bridge.js#sendLink
        - recruit-agent/server.js#executeWecomSideEffect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendLinkRequest'
      responses:
        '200':
          description: 发送结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMsgApiResult'

  /api/v1/message/sendApp:
    post:
      tags: [Message]
      summary: 发送小程序消息
      x-called-by:
        - recruit-agent/src/packages/channel-core/src/wecom-client.ts#sendApp
        - recruit-agent/wecom-bridge.js#sendApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendAppMessageRequest'
      responses:
        '200':
          description: 发送结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMsgApiResult'

  /api/v1/message/speechToText:
    post:
      tags: [Message]
      summary: 语音转文字
      x-called-by:
        - recruit-agent/src/packages/channel-core/src/wecom-client.ts#speechToText
        - recruit-agent/wecom-bridge.js#speechToText
        - recruit-agent/server.js#handleWecomCallback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeechToTextRequest'
      responses:
        '200':
          description: 识别结果；下游返回 data.text 时 recruit-agent 会读取 text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeechToTextApiResult'

  /api/v1/contact/getExternalContacts:
    post:
      tags: [Contact]
      summary: 获取外部联系人列表
      description: recruit-agent 用该接口同步企微联系人，并自行维护 vid 与业务 worker/manager 绑定关系。
      x-called-by:
        - recruit-agent/src/packages/channel-core/src/wecom-client.ts#getExternalContacts
        - recruit-agent/wecom-bridge.js#getExternalContacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetExternalContactsRequest'
            examples:
              firstPage:
                summary: 首次加载外部好友列表
                value:
                  uuid: 0190-example-uuid
                  limit: 100
                  seq: 0
              nextPage:
                summary: 使用上次响应 data.seq 继续下拉分页
                value:
                  uuid: 0190-example-uuid
                  limit: 100
                  seq: 8052931
      responses:
        '200':
          description: 外部联系人列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactListApiResult'

  /api/v1/contact/getInnerContacts:
    post:
      tags: [Contact]
      summary: 获取内部联系人列表
      x-called-by:
