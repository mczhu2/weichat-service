openapi: 3.0.3
info:
  title: weichat-service APIs currently used by recruit-agent
  version: 1.0.0
  description: |
    仅包含 /Users/mczhu/Documents/trae_projects/recruit-agent 当前代码中调用到的 weichat-service 接口。
    调用来源：
    - src/packages/channel-core/src/wecom-client.ts
    - wecom-bridge.js
    - server.js 回调/发送链路

    未纳入 47.94.7.218:9952 控制面 /wxwork/* 直连接口；这里只描述 weichat-service 的 8066 数据面。

    ## 集成必读

    ### 1. uuid 生命周期与传参位置
    - `uuid` 是 weichat-service 为一个企微运行客户端分配的实例标识，不是业务会话 ID。
    - 除 `/api/v1/init/init` 外，本文档里的业务接口都在 JSON body 中传 `uuid`；不要放 query，也不要放 header。
    - 调用方必须复用同一个 `uuid` 完成二维码登录、状态查询、联系人分页、消息发送、退出登录等后续链路。
    - 服务未在接口中暴露固定过期秒数；调用方应以 `/api/v1/init/getRunClientByUuid` 返回为准。`loginType=2` 且 `longLinkState=CONNECTED` 才按“可发消息”处理；失联、登出或查不到客户端时重新 `/api/v1/init/init`。

    ### 2. vid 与 automaticLogin
    - `vid` 是企微账号 ID，用于尝试复用已登录/已绑定账号；首次扫码登录成功后由服务端响应/状态数据返回，调用方可按业务需要持久化。
    - `/api/v1/init/init` 可不传 `vid`，表示创建新的登录客户端；传 `vid` 时表示希望复用该账号相关的客户端/登录态。
    - `/api/v1/init/automaticLogin` 只接收 body 中的 `uuid`，不是 query 参数。是否能自动登录取决于该 `uuid` 或服务端历史状态是否已有可复用登录态；没有历史登录态时按失败结果处理，再走普通二维码登录流程。

    ### 3. 登录状态判断
    - `loginState` 是初始化/旧协议返回的兼容字段，不能单独作为“可发消息”的最终判断。
    - `loginType` 是当前推荐的登录阶段字段：`0/空` 可视为未初始化或未知，`1` 可视为已初始化但未完成登录，`2` 表示已登录。
    - `longLinkState` 是长连接状态；`CONNECTED` 表示连接正常。
    - 调用方的就绪条件使用 AND：`loginType == 2 && longLinkState == 'CONNECTED'`。

    ### 4. 二维码、授权码与二次验证
    - `/api/v1/init/getQrCode` 返回的二维码字段可能是 `data.qrcode`、`data.qrCode` 或 `data.QrCodeUrl`；值可能是可直接展示的 URL/data URI，也可能是不带前缀的 base64 图片字符串。
    - 如果是裸 base64，前端需按图片类型补 `data:image/png;base64,` 或 `data:image/jpeg;base64,` 后再用于 `<img src>`。
    - `qrcodeKey` 来源于二维码响应里的 `data.Key`、`data.key` 或 `data.qrcodeKey`，后续 `/api/v1/init/checkCode` 需要带回。
    - `code`/授权码不是回调字段；H5 demo 设计为用户扫码后手动录入设备/页面展示的授权码。
    - 二次验证不是每次登录都触发。仅当扫码/授权后返回结果或提示明确要求二次授权时调用 `/api/v1/init/secondaryValidation`，否则继续轮询 `/api/v1/init/getRunClientByUuid`。
    - 二维码有效期未在 weichat-service 接口中稳定暴露；过期、扫码失败或授权码失效时重新获取二维码。

    ### 5. 联系人与群边界
    - `/api/v1/contact/getExternalContacts` 返回外部联系人/客户；单好友发文本时使用列表里的 `userId` 或兼容字段 `vid` 作为 `sendText.send_userid`。
    - `/api/v1/contact/getInnerContacts` 返回企业内部通讯录成员；它不是外部联系人列表。
    - `/api/v1/group/getChatroomMembers` 名称容易误解：该接口实际返回“外部客户群列表”，不是某个群的成员列表。要查某个群成员，用 `/api/v1/group/getRoomUserList`。
    - `room_id` 是外部群 ID，可能超过 JS 安全整数。浏览器/JS 客户端必须按字符串处理，再作为 `sendText.send_userid`。

    ### 6. 游标分页
    - 外部联系人：首次请求 `seq=0`；下一页请求使用上次响应 `data.seq`。没有新游标或接口返回失败时停止翻页。
    - 内部联系人：首次请求 `strSeq=''`；下一页请求使用上次响应中的字符串游标。
    - 外部群列表：首次请求 `star_index=0`；下一页请求使用上次响应 `data.next_start`。字段名是 `star_index`，不是 `start_index`。

    ### 7. sendText 发送规则
    - 单好友文本和外部群文本共用 `/api/v1/message/sendText`。
    - 单好友：`isRoom=false`，`send_userid` 填外部联系人的 `userId/vid`。
    - 外部群：`isRoom=true`，`send_userid` 填外部群列表返回的 `room_id`。
    - `send_userid` 后端字段是 Java `Long`；JS 客户端建议按十进制字符串传递，避免超过 `Number.MAX_SAFE_INTEGER` 后丢精度。
    - 本接口只发送纯文本；如需 @ 人或混合文本/表情，应使用对应扩展接口，本文档当前不把这些扩展参数暴露为最小集成路径。

    ### 8. 错误处理
    | 场景 | 判断 | 调用方处理 |
    | --- | --- | --- |
    | 成功 | HTTP 2xx 且响应体 `code=0` | 读取 `data`。 |
    | 业务/协议失败 | HTTP 2xx 但 `code!=0` | 展示/记录 `msg`，不要依赖固定文案做程序分支。 |
    | 网络/服务异常 | HTTP 非 2xx、超时或无法解析响应 | 按可重试失败处理，并保留请求参数和响应体用于排查。 |
    - 当前服务未提供稳定错误码枚举表；失败后建议先调用 `/api/v1/init/getRunClientByUuid` 复查客户端状态，再决定重试、重新扫码或提示人工处理。
servers:
  - url: http://localhost:8066
    description: local weichat-api
  - url: http://ai-agent.okgcc.cn/wx
    description: service demo page base path; nginx strips /wx before forwarding to weichat-api
  - url: http://47.115.229.106:8066
    description: recruit-agent legacy configured data plane

tags:
  - name: LoginAttach
    description: 登录挂靠与客户端状态
  - name: Contact
    description: 联系人/会话/群查询
  - name: Message
    description: agent 当前发送/语音转文字相关接口
  - name: Tag
    description: 标签接口，legacy wecom-bridge 当前调用
  - name: LocalData
    description: legacy wecom-bridge 当前写入本地消息数据接口

paths:
  /api/v1/init/init:
    post:
      tags: [LoginAttach]
      summary: 初始化企微客户端
      x-called-by:
        - recruit-agent/src/packages/channel-core/src/wecom-client.ts#init
        - api-call-service.html#callInitApi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitRequest'
            examples:
              emptyInit:
                summary: 最小初始化请求；可传空对象
                value: {}
      responses:
        '200':
          description: 初始化结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitApiResult'


