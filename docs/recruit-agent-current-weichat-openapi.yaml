    AddLabelRequest:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          required: [labelName]
          description: 新增联系人标签。
          properties:
            labelName:
              type: string
              description: 标签名称。
              example: 高意向候选人
      example:
        uuid: 0190-example-uuid
        labelName: 高意向候选人

    LabelAddUserRequest:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          required: [labelId, vids]
          description: 给联系人批量添加标签。
          properties:
            labelId:
              type: string
              description: 标签 ID。
              example: label-123
            vids:
              type: array
              description: 需要打标签的联系人 vid/userId 列表。
              items:
                oneOf:
                  - type: string
                  - type: integer
                    format: int64
              example: ['7881301772935700']
      example:
        uuid: 0190-example-uuid
        labelId: label-123
        vids: ['7881301772935700']

    LabelInfo:
      type: object
      description: 标签信息。
      properties:
        labelId:
          type: string
          description: 标签 ID。
          example: label-123
        labelName:
          type: string
          description: 标签名称。
          example: 高意向候选人
        color:
          type: string
          description: 标签颜色。
          example: '#2f80ed'
        userCount:
          type: integer
          description: 标签下用户数量。
          example: 10
        createTime:
          type: integer
          format: int64
          description: 标签创建时间 Unix 时间戳。
          example: 1768975066

    LabelListResponse:
      type: object
      description: 标签列表响应。
      properties:
        total:
          type: integer
          description: 标签总数。
          example: 3
        list:
          type: array
          description: 标签列表。
          items:
            $ref: '#/components/schemas/LabelInfo'
      example:
        total: 1
        list:
          - labelId: label-123
            labelName: 高意向候选人
            color: '#2f80ed'
            userCount: 10
            createTime: 1768975066

    LabelListApiResult:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LabelListResponse'

    CallbackIngressRequest:
      type: object
      required: [uuid]
      description: 下游企微组件推送到 weichat-service 的回调入口请求体。CallbackRequest.json 已兼容字符串和对象两种形态。
      properties:
        uuid:
          type: string
          description: 回调归属客户端 UUID。
          example: 0190-example-uuid
        type:
          type: string
          description: 回调类型；如消息、好友变更、群事件等，具体值以协议服务推送为准。
          example: Message
        json:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
          description: 原始回调 JSON；可为 JSON 字符串，也可为对象。
          example:
            msgId: '189000000001'
            fromUserId: 7881301772935700
            content: 你好
      example:
        uuid: 0190-example-uuid
        type: Message
        json:
          msgId: '189000000001'
          fromUserId: 7881301772935700
          content: 你好
