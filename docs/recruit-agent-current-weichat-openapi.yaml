            examples:
              firstPage:
                summary: 首次加载外部好友列表
                value:
                  uuid: 0190-example-uuid
                  limit: 100
                  seq: 0
              nextPage:
                summary: 使用上次响应 data.seq 继续下拉分页
                value:
