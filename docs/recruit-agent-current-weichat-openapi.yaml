      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetInnerContactsRequest'
      responses:
        '200':
          description: 内部联系人列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InnerContactListApiResult'

  /api/v1/contact/getUserInfoByVids:
    post:
      tags: [Contact]
      summary: 根据 vids 查询联系人详情
      x-called-by:
        - recruit-agent/src/packages/channel-core/src/wecom-client.ts#getUserInfoByVids
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VidsRequest'
      responses:
        '200':
          description: 联系人详情数组
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactArrayApiResult'

  /api/v1/contact/getSessionList:
    post:
      tags: [Contact]
      summary: 获取会话列表
      x-called-by:
